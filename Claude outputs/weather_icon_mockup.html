<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天気マークの表示イメージ</title>
<style>
  body {
    margin: 0;
    padding: 32px 20px;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #e2e8f0;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
    color: #f1f5f9;
  }
  p.sub {
    margin: 0 0 28px;
    color: #94a3b8;
    font-size: 13px;
  }
  .section {
    margin-bottom: 36px;
  }
  .section h2 {
    font-size: 13px;
    color: #7dd3fc;
    margin: 0 0 10px;
    font-weight: 700;
  }
  .row {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: rgba(226,232,240,0.06);
    border: 1px solid rgba(148,163,184,0.25);
    border-radius: 12px;
    width: fit-content;
  }
  .tab {
    position: relative;
    width: 85px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    overflow: hidden;
    background: #fff;
    color: #334155;
    border: 1px solid #cbd5e1;
  }
  .tab.selected {
    background: linear-gradient(to bottom, #34d399, #10b981);
    color: #0f172a;
    border: 2px solid #6ee7b7;
  }
  .tab .weekday {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    z-index: 2;
  }
  .tab .date {
    font-size: 18px;
    font-weight: 700;
    font-family: ui-monospace, monospace;
    margin-top: 2px;
    z-index: 2;
  }
  /* 現状：左上に小さいアイコン */
  .icon-corner {
    position: absolute;
    top: 0;
    left: 4px;
    font-size: 13px;
    line-height: 1;
    z-index: 2;
  }
  /* 案A：中央にうっすら大きく表示（背景っぽい透かし） */
  .icon-watermark-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    line-height: 1;
    opacity: 0.22;
    z-index: 1;
    pointer-events: none;
  }
  /* 案B：右下寄りにうっすら大きく表示 */
  .icon-watermark-corner {
    position: absolute;
    bottom: -6px;
    right: -4px;
    font-size: 34px;
    line-height: 1;
    opacity: 0.25;
    z-index: 1;
    pointer-events: none;
    transform: rotate(-8deg);
  }
  /* 案C：もっと控えめ（さらに薄く・小さめ） */
  .icon-watermark-soft {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    line-height: 1;
    opacity: 0.14;
    z-index: 1;
    pointer-events: none;
  }
  .label {
    font-size: 11px;
    color: #64748b;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>天気マークの表示イメージ（試作）</h1>
  <p class="sub">実際の日付タブのスタイルに合わせたモックアップです。いくつか濃さ・位置のパターンを並べています。</p>

  <div class="section">
    <h2>現状：左上に小さいアイコン</h2>
    <div class="row">
      <div class="tab">
        <span class="icon-corner">☀️</span>
        <span class="weekday">木</span>
        <span class="date">09/10</span>
      </div>
      <div class="tab selected">
        <span class="icon-corner">🌧️</span>
        <span class="weekday">金</span>
        <span class="date">09/11</span>
      </div>
      <div class="tab">
        <span class="icon-corner">⛅</span>
        <span class="weekday">土</span>
        <span class="date">09/12</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>案A：中央にうっすら大きく（透かし風）</h2>
    <div class="row">
      <div class="tab">
        <span class="icon-watermark-center">☀️</span>
        <span class="weekday">木</span>
        <span class="date">09/10</span>
      </div>
      <div class="tab selected">
        <span class="icon-watermark-center">🌧️</span>
        <span class="weekday">金</span>
        <span class="date">09/11</span>
      </div>
      <div class="tab">
        <span class="icon-watermark-center">⛅</span>
        <span class="weekday">土</span>
        <span class="date">09/12</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>案B：右下に斜めにうっすら</h2>
    <div class="row">
      <div class="tab">
        <span class="icon-watermark-corner">☀️</span>
        <span class="weekday">木</span>
        <span class="date">09/10</span>
      </div>
      <div class="tab selected">
        <span class="icon-watermark-corner">🌧️</span>
        <span class="weekday">金</span>
        <span class="date">09/11</span>
      </div>
      <div class="tab">
        <span class="icon-watermark-corner">⛅</span>
        <span class="weekday">土</span>
        <span class="date">09/12</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>案C：さらに控えめ（小さめ・薄め）</h2>
    <div class="row">
      <div class="tab">
        <span class="icon-watermark-soft">☀️</span>
        <span class="weekday">木</span>
        <span class="date">09/10</span>
      </div>
      <div class="tab selected">
        <span class="icon-watermark-soft">🌧️</span>
        <span class="weekday">金</span>
        <span class="date">09/11</span>
      </div>
      <div class="tab">
        <span class="icon-watermark-soft">⛅</span>
        <span class="weekday">土</span>
        <span class="date">09/12</span>
      </div>
    </div>
  </div>
</body>
</html>
